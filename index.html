<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KOL 邮件生成器</title>
  <style>
    :root {
      --primary: #7C5CFC;
      --primary-light: #ede9ff;
      --primary-dark: #5a3de0;
      --accent: #FF6B9D;
      --bg: #f7f6ff;
      --card: #ffffff;
      --text: #1a1a2e;
      --muted: #8888aa;
      --border: #e2deff;
      --success: #22c55e;
      --danger: #ef4444;
      --radius: 14px;
      --shadow: 0 4px 24px rgba(124,92,252,0.10);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ─── Header ─── */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, #a78bfa 100%);
      color: white;
      padding: 24px 20px 20px;
      text-align: center;
    }
    header .logo { font-size: 28px; margin-bottom: 4px; }
    header h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.5px; }
    header p { opacity: .85; font-size: .88rem; margin-top: 4px; }

    /* ─── Layout ─── */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 50px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
    }

    /* ─── Card ─── */
    .card {
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      padding: 20px;
    }
    .card-title {
      font-size: .95rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ─── Form ─── */
    .form-row { margin-bottom: 14px; }
    label {
      display: block;
      font-size: .82rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
    }
    label span { color: var(--accent); }
    input, select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: .9rem;
      font-family: inherit;
      color: var(--text);
      background: #fff;
      transition: border .2s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(124,92,252,.12);
    }
    textarea { resize: vertical; min-height: 140px; line-height: 1.6; font-size: .92rem; }

    /* ─── Scenario chips ─── */
    .chip-group {
      display: flex; flex-wrap: wrap; gap: 7px;
    }
    .chip {
      padding: 5px 12px;
      border-radius: 18px;
      border: 1.5px solid var(--border);
      font-size: .78rem;
      cursor: pointer;
      background: #fafafa;
      transition: all .18s;
      user-select: none;
    }
    .chip:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .chip.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* ─── Template section ─── */
    .template-section {
      background: #fafbff;
      border: 1.5px dashed var(--border);
      border-radius: 10px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .template-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 10px;
    }
    .template-header span {
      font-size: .8rem; font-weight: 700; color: var(--primary);
    }
    .template-list {
      display: flex; flex-direction: column; gap: 6px;
      max-height: 160px; overflow-y: auto;
    }
    .template-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 8px 10px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 7px;
      font-size: .82rem;
      cursor: pointer;
      transition: all .15s;
    }
    .template-item:hover {
      border-color: var(--primary);
      background: var(--primary-light);
    }
    .template-item-name {
      flex: 1; margin-right: 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .template-item-delete {
      color: var(--danger);
      cursor: pointer;
      padding: 2px 6px;
      font-size: .75rem;
      opacity: .6;
    }
    .template-item-delete:hover { opacity: 1; }

    .template-input-row {
      display: flex; gap: 8px;
      margin-top: 10px;
    }
    .template-input-row input {
      flex: 1;
      padding: 7px 10px;
      font-size: .82rem;
    }
    .btn-small {
      padding: 7px 12px;
      border: none;
      border-radius: 7px;
      background: var(--primary);
      color: white;
      font-size: .78rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-small:hover { opacity: .9; }

    /* ─── Generate button ─── */
    .btn-generate {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 11px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity .2s, transform .15s;
      letter-spacing: .2px;
    }
    .btn-generate:hover { opacity: .92; transform: translateY(-1px); }
    .btn-generate:active { transform: translateY(0); }
    .btn-generate:disabled { opacity: .5; cursor: not-allowed; }

    /* ─── Output panel ─── */
    .output-panel { display: flex; flex-direction: column; gap: 12px; }

    .subject-box {
      background: var(--primary-light);
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 10px 13px;
    }
    .subject-label {
      font-size: .72rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 3px;
    }
    .subject-text {
      font-size: .93rem;
      font-weight: 600;
      color: var(--text);
      word-break: break-word;
    }

    .email-body {
      background: #fafbff;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      padding: 16px;
      font-size: .9rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 200px;
      color: var(--text);
      flex: 1;
    }

    .placeholder-hint {
      background: #fff8e7;
      border: 1px solid #ffd97a;
      border-radius: 7px;
      padding: 8px 12px;
      font-size: .78rem;
      color: #a06000;
      display: none;
    }

    /* ─── Action buttons ─── */
    .action-row {
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .btn-action {
      flex: 1;
      min-width: 100px;
      padding: 9px 14px;
      border-radius: 9px;
      border: 1.5px solid var(--border);
      background: white;
      font-size: .84rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .18s;
      display: flex; align-items: center; justify-content: center; gap: 5px;
    }
    .btn-action:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .btn-action.copied { background: var(--success); color: white; border-color: var(--success); }

    /* ─── Empty state ─── */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 280px;
      color: var(--muted);
      gap: 10px;
    }
    .empty-state .icon { font-size: 40px; }
    .empty-state p { font-size: .85rem; text-align: center; line-height: 1.6; }

    /* ─── Language tag ─── */
    .meta-row {
      display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
    }
    .meta-tag {
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: .74rem;
      font-weight: 600;
    }

    /* ─── Loader ─── */
    .loader {
      display: none;
      align-items: center;
      justify-content: center;
      min-height: 180px;
      flex-direction: column;
      gap: 14px;
      color: var(--primary);
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid var(--primary-light);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Tip ─── */
    .tip {
      background: linear-gradient(135deg,#f0ebff,#fce4f0);
      border-radius: 9px;
      padding: 10px 13px;
      font-size: .78rem;
      color: #5a3de0;
      line-height: 1.5;
    }

    /* ─── Footer ─── */
    footer {
      text-align: center;
      padding: 18px;
      font-size: .76rem;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <div class="logo">✉️</div>
  <h1>KOL 邮件生成器</h1>
  <p>一句话描述需求，AI 生成专业邮件</p>
</header>

<div class="container">

  <!-- ─── Left: Form ─── -->
  <div class="card">
    <div class="card-title">✍️ 填写信息</div>

    <div class="form-row">
      <label>品牌名称 <span>*</span></label>
      <input type="text" id="brandName" placeholder="例：可可美妆 / GlowCo" />
    </div>

    <div class="form-row">
      <label>一句话描述需求</label>
      <textarea id="prompt" placeholder="例：发给小红书博主@美妆日记本，邀请她合作一条护肤品测评视频，报酬2000元，4月中旬发布"></textarea>
    </div>

    <div class="form-row">
      <label>合作场景（可选）</label>
      <div class="chip-group" id="scenarioChips">
        <div class="chip active" data-val="outreach">📨 邀约</div>
        <div class="chip" data-val="gifting">📦 样品</div>
        <div class="chip" data-val="review">✅ 审核</div>
        <div class="chip" data-val="thanks">🙏 致谢</div>
        <div class="chip" data-val="renewal">🔄 续约</div>
      </div>
    </div>

    <!-- ─── Template Management ─── -->
    <div class="template-section">
      <div class="template-header">
        <span>💾 保存的模板</span>
        <span style="font-size:.72rem; color:var(--muted)">点击加载 | 点击 × 删除</span>
      </div>
      <div class="template-list" id="templateList">
        <!-- Templates will be rendered here -->
      </div>
      <div class="template-input-row">
        <input type="text" id="newTemplateName" placeholder="模板名称..." />
        <button class="btn-small" onclick="saveTemplate()">保存当前</button>
      </div>
    </div>

    <button class="btn-generate" id="generateBtn" onclick="generateEmail()">
      ✨ 生成邮件
    </button>

    <div class="tip" style="margin-top:14px">
      💡 直接描述需求，AI 会自动提取信息并生成邮件。保存常用模板可一键复用。
    </div>
  </div>

  <!-- ─── Right: Output ─── -->
  <div class="card output-panel">

    <!-- Empty state -->
    <div class="empty-state" id="emptyState">
      <div class="icon">✉️</div>
      <p>填写品牌和需求，<br>点击「生成邮件」即可</p>
    </div>

    <!-- Loader -->
    <div class="loader" id="loader">
      <div class="spinner"></div>
      <span>AI 正在生成邮件…</span>
    </div>

    <!-- Result -->
    <div id="result" style="display:none; display:flex; flex-direction:column; gap:12px; display:none">

      <div class="card-title">📧 邮件草稿</div>

      <div class="meta-row" id="metaRow"></div>

      <div class="subject-box">
        <div class="subject-label">主题 / Subject</div>
        <div class="subject-text" id="subjectOutput"></div>
      </div>

      <div class="email-body" id="bodyOutput"></div>

      <div class="placeholder-hint" id="placeholderHint">
        ⚠️ 邮件中包含 <strong>【待填写】</strong> 占位符，请在发送前替换为实际内容。
      </div>

      <div class="action-row">
        <button class="btn-action" id="copyBtn" onclick="copyEmail()">
          📋 复制全文
        </button>
        <button class="btn-action" onclick="copySubject()">
          🔗 复制主题
        </button>
        <button class="btn-action" onclick="downloadEmail()">
          💾 下载
        </button>
        <button class="btn-action" onclick="resetForm()">
          🔄 重新生成
        </button>
      </div>

    </div>
  </div>

</div>

<footer>
  KOL 邮件生成器 · 一句话生成专业邮件
</footer>

<script>
// ── Template Management (localStorage) ──
const TEMPLATES_KEY = 'kol_email_templates';

function getTemplates() {
  try {
    return JSON.parse(localStorage.getItem(TEMPLATES_KEY)) || [];
  } catch {
    return [];
  }
}

function saveTemplates(templates) {
  localStorage.setItem(TEMPLATES_KEY, JSON.stringify(templates));
}

function renderTemplates() {
  const list = document.getElementById('templateList');
  const templates = getTemplates();
  if (templates.length === 0) {
    list.innerHTML = '<div style="color:var(--muted);font-size:.78rem;text-align:center;padding:10px;">暂无保存的模板</div>';
    return;
  }
  list.innerHTML = templates.map((t, i) => `
    <div class="template-item" onclick="loadTemplate(${i})">
      <span class="template-item-name">${escapeHtml(t.name)}</span>
      <span class="template-item-delete" onclick="event.stopPropagation(); deleteTemplate(${i})">×</span>
    </div>
  `).join('');
}

function saveTemplate() {
  const brand = document.getElementById('brandName').value.trim();
  const prompt = document.getElementById('prompt').value.trim();
  const nameInput = document.getElementById('newTemplateName');
  const name = nameInput.value.trim();

  if (!brand && !prompt) {
    alert('请先填写品牌或需求信息');
    return;
  }

  const templates = getTemplates();
  const newName = name || `模板 ${templates.length + 1}`;

  templates.unshift({
    name: newName,
    brand,
    prompt,
    scenario: getSelectedScenario()
  });

  saveTemplates(templates);
  renderTemplates();
  nameInput.value = '';
}

function loadTemplate(index) {
  const templates = getTemplates();
  const t = templates[index];
  document.getElementById('brandName').value = t.brand || '';
  document.getElementById('prompt').value = t.prompt || '';
  if (t.scenario) {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    const chip = document.querySelector(`.chip[data-val="${t.scenario}"]`);
    if (chip) chip.classList.add('active');
  }
}

function deleteTemplate(index) {
  if (!confirm('确定要删除这个模板吗？')) return;
  const templates = getTemplates();
  templates.splice(index, 1);
  saveTemplates(templates);
  renderTemplates();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ── Initialize templates ──
renderTemplates();

// ── Scenario chip selection ──
document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
  });
});

function getSelectedScenario() {
  const active = document.querySelector('.chip.active');
  return active ? active.dataset.val : 'outreach';
}

// ── Parse prompt with AI-like extraction ──
function parsePrompt(prompt) {
  // Extract KOL name (handles @, 名字, name, to, 给等)
  let kol = null;
  const kolPatterns = [
    /@([\w\u4e00-\u9fff]+)/,
    /给\s*([A-Z][a-z]+|[^\s，。！]+[博主|博主])/i,
    /发给\s*([A-Z][a-z]+|[^\s，。！]+)/i,
    /to\s+([A-Z][a-z]+)/i,
    /KOL[:：]\s*([^\s，。！]+)/i
  ];
  for (const p of kolPatterns) {
    const m = prompt.match(p);
    if (m) { kol = m[1]; break; }
  }

  // Extract platform
  let platform = null;
  const platPatterns = [
    /小红书|xiaohongshu/i,
    /微博|weibo/i,
    /微信|wechat/i,
    /抖音|douyin/i,
    /Instagram|instagram|IG/i,
    /TikTok|tiktok/i,
    /YouTube|youtube/i,
    /B站|Bilibili|bilibili/i
  ];
  for (const [k, p] of platPatterns) {
    if (p.test(prompt)) {
      if (k.includes('小红书')) platform = '小红书';
      else if (k.includes('微博')) platform = '微博';
      else if (k.includes('微信')) platform = '微信';
      else if (k.includes('抖音')) platform = '抖音';
      else if (k.toLowerCase().includes('instagram')) platform = 'Instagram';
      else if (k.toLowerCase().includes('tiktok')) platform = 'TikTok';
      else if (k.toLowerCase().includes('youtube')) platform = 'YouTube';
      else if (k.includes('B站') || k.toLowerCase().includes('bilibili')) platform = 'B站';
      break;
    }
  }

  // Extract niche/topic
  let niche = null;
  const nichePatterns = [
    /关于\s*([^\s，。！]+)\s*内容/,
    /做\s*([^\s，。！]+)\s*测评/,
    /做\s*([^\s，。！]+)\s*vlog/i,
    /([^\s，。！]+)博主/
  ];
  for (const p of nichePatterns) {
    const m = prompt.match(p);
    if (m) { niche = m[1]; break; }
  }

  // Extract details (everything else)
  let details = prompt;
  if (kol) details = details.replace(new RegExp(`@${kol}|给\\s*${kol}`, 'gi'), '');
  if (platform) details = details.replace(new RegExp(platform, 'gi'), '');
  details = details.replace(/邀请|合作|发给|发给|邮件|写一封/gi, '').trim();
  details = details || '【待填写：合作详情】';

  return { kol, platform, niche, details };
}

// ── Language detection ──
function detectLanguage(text) {
  if (!text) return 'en';

  // Check for Japanese
  if (/[\u3040-\u30ff\u31f0-\u31ff\uff65-\uff9f]/.test(text)) return 'ja';
  // Check for Korean
  if (/[\uac00-\ud7af]/.test(text)) return 'ko';
  // Check for Chinese
  if (/[\u4e00-\u9fff]/.test(text)) return 'zh';
  // Check for French
  if (/[àáâãäåæçèéêëìíîïðñòóôõöùúûüý]/i.test(text)) return 'fr';
  // Check for Spanish
  if (/[áéíóúüñ¿¡]/i.test(text)) return 'es';
  return 'en';
}

const LANG_LABELS = {
  zh: '🇨🇳 中文',
  en: '🇺🇸 English',
  ja: '🇯🇵 日本語',
  fr: '🇫🇷 Français',
  es: '🇪🇸 Español',
  ko: '🇰🇷 한국어'
};

const SCENARIO_LABELS = {
  outreach: '📨 合作邀约',
  gifting: '📦 样品寄送',
  review: '✅ 内容审核',
  thanks: '🙏 合作致谢',
  renewal: '🔄 续约合作'
};

// ── Template engine ──
function buildEmail(lang, scenario, brand, parsed) {
  const { kol, platform, niche, details } = parsed;

  const B = brand || '【品牌名称】';
  const S = '【您的姓名】';
  const K = kol;
  const P = platform || '【平台】';
  const N = niche || '【内容方向】';
  const D = details || '【待填写：合作详情】';

  const greetings = {
    zh: K ? `${K} 您好，` : '您好，',
    en: K ? `Hi ${kol.replace(/^@/, '')},` : 'Hi there,',
    ja: K ? `${K} 様` : 'ご担当者様',
    fr: K ? `Bonjour ${kol.replace(/^@/, '')},` : 'Bonjour,',
    es: K ? `Hola ${kol.replace(/^@/, '')},` : 'Hola,',
    ko: K ? `안녕하세요, ${kol.replace(/^@/, '')}님` : '안녕하세요,'
  };

  const closings = {
    zh: `期待您的回复！\n\n此致\n${S}\n${B}`,
    en: `Looking forward to hearing from you!\n\nWarm regards,\n${S}\n${B}`,
    ja: `ご返信をお待ちしております。\nどうぞよろしくお願いいたします。\n\n${S}\n${B}`,
    fr: `Dans l'attente de votre retour,\nCordialement,\n${S}\n${B}`,
    es: `Quedo a tu disposición para cualquier consulta.\n\nUn cordial saludo,\n${S}\n${B}`,
    ko: `답변 기다리겠습니다.\n감사합니다.\n\n${S}\n${B}`
  };

  const g = greetings[lang] || greetings.en;
  const c = closings[lang] || closings.en;

  const templates = {
    zh: {
      outreach: {
        subject: `邀请与「${B}」开展合作——专属KOL机会`,
        body: `${g}\n\n我是来自「${B}」的${S}。长期关注您在${P}上关于${N}的内容，非常欣赏您独特的创作风格和与粉丝之间真实的互动。\n\n目前我们正在为${D}寻找优质的创作者合作伙伴，相信您的受众与我们的品牌理念高度契合，期待能有机会与您合作。\n\n如果您有兴趣，非常期待进一步沟通！请随时回复此邮件，期待您的来信。\n\n${c}`
      },

// ── Main generate function ──
function generateEmail() {
  const brandName = document.getElementById('brandName').value.trim();
  const prompt = document.getElementById('prompt').value.trim();

  if (!brandName) {
    document.getElementById('brandName').focus();
    document.getElementById('brandName').style.borderColor = '#ef4444';
    setTimeout(() => document.getElementById('brandName').style.borderColor = '', 1500);
    return;
  }

  // Show loader
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('result').style.display = 'none';
  document.getElementById('loader').style.display = 'flex';

  setTimeout(() => {
    const lang = detectLanguage(prompt);
    const scenario = getSelectedScenario();
    const parsed = parsePrompt(prompt);

    const { subject, body } = buildEmail(lang, scenario, brandName, parsed);

    // Meta tags
    const metaRow = document.getElementById('metaRow');
    metaRow.innerHTML = `
      <span class="meta-tag">${LANG_LABELS[lang] || lang}</span>
      <span class="meta-tag">${SCENARIO_LABELS[scenario]}</span>
    `;

    document.getElementById('subjectOutput').textContent = subject;
    document.getElementById('bodyOutput').textContent = body;

    // Placeholder hint
    const hint = document.getElementById('placeholderHint');
    if (body.includes('【') || subject.includes('【')) {
      hint.style.display = 'block';
    } else {
      hint.style.display = 'none';
    }

    document.getElementById('loader').style.display = 'none';
    document.getElementById('result').style.display = 'flex';
  }, 500);
}

// ── Copy functions ──
function copyEmail() {
  const subject = document.getElementById('subjectOutput').textContent;
  const body = document.getElementById('bodyOutput').textContent;
  const full = `主题：${subject}\n\n${body}`;
  navigator.clipboard.writeText(full).then(() => {
    const btn = document.getElementById('copyBtn');
    btn.textContent = '✅ 已复制！';
    btn.classList.add('copied');
    setTimeout(() => {
      btn.textContent = '📋 复制全文';
      btn.classList.remove('copied');
    }, 2000);
  });
}

function copySubject() {
  const subject = document.getElementById('subjectOutput').textContent;
  navigator.clipboard.writeText(subject);
}

function downloadEmail() {
  const subject = document.getElementById('subjectOutput').textContent;
  const body = document.getElementById('bodyOutput').textContent;
  const content = `主题：${subject}\n\n${body}`;
  const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `KOL邮件_${new Date().toLocaleDateString('zh-CN').replace(/\//g,'-')}.txt`;
  a.click();
  URL.revokeObjectURL(url);
}

function resetForm() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('emptyState').style.display = 'flex';
  document.getElementById('brandName').focus();
}

// Enter key triggers generate
document.getElementById('prompt').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.ctrlKey) generateEmail();
});
document.getElementById('brandName').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('prompt').focus();
});
